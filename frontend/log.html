<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Session Logs — EcoSentinel</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="logo.svg">
</head>
<body>
    <div id="shell-root"></div>

    <!-- Firebase CDN (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>

    <script>
        (async function() {
            var session = await WI.renderShell('logs', 'SESSION LOG STREAM');

            document.getElementById('page-slot').innerHTML = `
                <div class="page">
                    <div class="page-head">
                        <div class="eyebrow">MOD-14 — Firestore /images/ &middot; /audio/</div>
                        <h1>Cloud Database Logs</h1>
                        <p>Live telemetry data from the Firestore cloud database. All detection and bioacoustic records are stored persistently and queryable across sessions.</p>
                    </div>

                    <div class="metrics-grid" style="display:grid; grid-template-columns:repeat(4,1fr); gap:20px; margin-bottom:24px;">
                        <div class="card" style="padding:20px;">
                            <div class="mono" style="font-size:10px; color:var(--text-faint); text-transform:uppercase;">Total Records</div>
                            <h2 style="font-size:28px; margin-top:5px; color:var(--accent-gold);" id="stat-total">—</h2>
                        </div>
                        <div class="card" style="padding:20px;">
                            <div class="mono" style="font-size:10px; color:var(--text-faint); text-transform:uppercase;">Image Detections</div>
                            <h2 style="font-size:28px; margin-top:5px; color:var(--accent-blue);" id="stat-images">—</h2>
                        </div>
                        <div class="card" style="padding:20px;">
                            <div class="mono" style="font-size:10px; color:var(--text-faint); text-transform:uppercase;">Audio Clips</div>
                            <h2 style="font-size:28px; margin-top:5px; color:var(--accent-gold);" id="stat-audio">—</h2>
                        </div>
                        <div class="card" style="padding:20px;">
                            <div class="mono" style="font-size:10px; color:var(--text-faint); text-transform:uppercase;">Avg Confidence</div>
                            <h2 style="font-size:28px; margin-top:5px; color:var(--accent-emerald);" id="stat-conf">—</h2>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-head">
                            <h3>Database Records</h3>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <input type="text" id="log-search" class="text-input mono" placeholder="Filter by species..." style="padding:6px 12px; font-size:12px; width:180px;">
                                <button class="btn btn-ghost" id="export-csv" style="padding:6px 12px; font-size:12px;">Export CSV</button>
                                <button class="btn btn-ghost" id="refresh-btn" style="padding:6px 12px; font-size:12px; color:var(--accent-emerald); border-color:rgba(74,222,128,0.2)">Refresh</button>
                            </div>
                        </div>
                        <div class="card-body" style="padding:0;">
                            <div class="log-table-container">
                                <table class="log-table">
                                    <thead>
                                        <tr>
                                            <th>Timestamp</th>
                                            <th>Document ID</th>
                                            <th>Modality</th>
                                            <th>Site</th>
                                            <th>Species</th>
                                            <th>Confidence</th>
                                        </tr>
                                    </thead>
                                    <tbody id="log-table-body">
                                        <tr><td colspan="6" class="empty-state">Loading records from Firestore...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            var tableBody = document.getElementById('log-table-body');
            var searchInput = document.getElementById('log-search');
            var allRecords = [];

            async function loadRecords() {
                tableBody.innerHTML = '<tr><td colspan="6" class="empty-state">Querying Firestore...</td></tr>';
                allRecords = [];

                try {
                    // Fetch images and audio collections
                    var images = await FireDB.getAllImages(200);
                    var audio  = await FireDB.getAllAudio(200);

                    // Normalize into unified records
                    images.forEach(function(r) {
                        allRecords.push({
                            timestamp: r.uploaded_at ? r.uploaded_at.toDate() : new Date(),
                            docId: r.id,
                            kind: 'detection',
                            site: r.site || '—',
                            species: r.species_name || '—',
                            confidence: r.confidence || 0
                        });
                    });
                    audio.forEach(function(r) {
                        allRecords.push({
                            timestamp: r.uploaded_at ? r.uploaded_at.toDate() : new Date(),
                            docId: r.id,
                            kind: 'audio',
                            site: r.site || '—',
                            species: r.species_name || '—',
                            confidence: r.confidence || 0
                        });
                    });

                    // Sort by timestamp descending
                    allRecords.sort(function(a, b) { return b.timestamp - a.timestamp; });

                    renderStats();
                    renderTable();
                } catch (e) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="empty-state" style="color:var(--accent-crimson)">Failed to load from Firestore: ' + e.message + '</td></tr>';
                    console.error(e);
                }
            }

            function renderStats() {
                document.getElementById('stat-total').textContent = allRecords.length;
                document.getElementById('stat-images').textContent = allRecords.filter(function(r) { return r.kind === 'detection'; }).length;
                document.getElementById('stat-audio').textContent = allRecords.filter(function(r) { return r.kind === 'audio'; }).length;

                var confs = allRecords.map(function(r) { return r.confidence; }).filter(function(c) { return c > 0; });
                if (confs.length > 0) {
                    var avg = confs.reduce(function(a,b) { return a+b; }, 0) / confs.length;
                    document.getElementById('stat-conf').textContent = avg.toFixed(1) + '%';
                } else {
                    document.getElementById('stat-conf').textContent = '—';
                }
            }

            function renderTable() {
                var query = searchInput.value.toLowerCase().trim();
                var filtered = allRecords.filter(function(r) {
                    return r.species.toLowerCase().includes(query) || r.docId.toLowerCase().includes(query);
                });

                if (filtered.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="6" class="empty-state">' + (query ? 'No records match your filter.' : 'No records in the database yet.') + '</td></tr>';
                    return;
                }

                tableBody.innerHTML = filtered.map(function(r) {
                    var dateStr = r.timestamp.toLocaleTimeString() + ' (' + r.timestamp.toLocaleDateString() + ')';
                    var badgeClass = r.kind === 'detection' ? 'detection' : 'audio';
                    var confidence = r.confidence > 0 ? r.confidence.toFixed(1) + '%' : '—';

                    return '<tr>' +
                        '<td class="mono" style="font-size:12px;">' + dateStr + '</td>' +
                        '<td class="mono" style="color:var(--accent-gold);font-size:11px;">' + r.docId.substring(0,12) + '…</td>' +
                        '<td><span class="log-badge ' + badgeClass + '">' + r.kind + '</span></td>' +
                        '<td class="mono" style="font-size:12px;">' + r.site + '</td>' +
                        '<td style="text-transform:capitalize;font-weight:500;color:var(--text-main);">' + r.species + '</td>' +
                        '<td class="mono" style="color:var(--accent-emerald);font-weight:600;">' + confidence + '</td>' +
                        '</tr>';
                }).join('');
            }

            searchInput.addEventListener('input', renderTable);
            document.getElementById('refresh-btn').addEventListener('click', loadRecords);

            document.getElementById('export-csv').addEventListener('click', function() {
                if (allRecords.length === 0) { WI.toast('No data to export'); return; }
                var csv = 'Timestamp,Document ID,Modality,Site,Species,Confidence\n';
                allRecords.forEach(function(r) {
                    csv += '"' + r.timestamp.toISOString() + '","' + r.docId + '","' + r.kind + '","' + r.site + '","' + r.species + '","' + r.confidence + '"\n';
                });
                var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                var url = URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                a.download = 'wildlife_firestore_export_' + new Date().toISOString().slice(0,10) + '.csv';
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
                WI.toast('CSV downloaded');
            });

            // Load on start
            loadRecords();
        })();
    </script>
</body>
</html>
